<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="index.js "defer></script>
    <title>Form</title>
</head>
<body>
    <div class="container mt-5 rounded-2  card shadow p-3" style="width: 300px;">
    
       <form onsubmit="submits(event)">

    <input oninput="displayvalue()" type="text" id="name" class="form-control m-1" placeholder="Student Name">

    <input type="email" id="mail" class="form-control m-1" placeholder="Email">

    <select class="form-control m-1" id="choice" onchange="selectdepartment()">
        <option>--select department--</option>
        <option value="Computer Science">Computer Science</option>
        <option value="Computer Application">Computer Application</option>
        <option value="Statistics">Statistics</option>
    </select>

    <button type="submit" class="btn btn-primary mt-2 w-100">Submit</button>

    </form>
    </div>
    <p id="namevalue"></p>
    <p id="selectvalue"></p>
    
    
</body>
</html>
